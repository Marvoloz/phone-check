<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">

    <title>Phone Check — WebGL Diagnostics</title>

    <style>
        :root {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            line-height: 1.45;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            background:
                Canvas;

            color:
                CanvasText;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin:
                0
                0
                8px;

            font-size:
                clamp(
                    24px,
                    5vw,
                    36px
                );
        }

        .subtitle {
            margin:
                0
                0
                20px;

            opacity: 0.75;
        }

        .card {
            margin:
                0
                0
                16px;

            padding: 16px;

            border:
                1px solid
                color-mix(
                    in srgb,
                    CanvasText 18%,
                    transparent
                );

            border-radius: 12px;

            background:
                color-mix(
                    in srgb,
                    Canvas 96%,
                    CanvasText 4%
                );
        }

        .card h2 {
            margin:
                0
                0
                12px;

            font-size: 20px;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        260px,
                        1fr
                    )
                );

            gap: 12px;
        }

        .metric {
            padding: 10px 12px;

            border:
                1px solid
                color-mix(
                    in srgb,
                    CanvasText 12%,
                    transparent
                );

            border-radius: 9px;
        }

        .metric-label {
            display: block;

            margin-bottom: 3px;

            font-size: 12px;

            opacity: 0.65;
        }

        .metric-value {
            display: block;

            word-break: break-word;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;

            font-size: 13px;
        }

        .buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 14px;
        }

        button {
            appearance: none;

            padding: 10px 14px;

            border:
                1px solid
                color-mix(
                    in srgb,
                    CanvasText 22%,
                    transparent
                );

            border-radius: 9px;

            background:
                color-mix(
                    in srgb,
                    Canvas 88%,
                    CanvasText 12%
                );

            color:
                CanvasText;

            font: inherit;

            cursor: pointer;
        }

        button:active {
            transform: translateY(1px);
        }

        .status {
            min-height: 24px;

            margin-top: 10px;

            font-size: 14px;
        }

        details {
            margin-top: 14px;
        }

        summary {
            cursor: pointer;

            font-weight: 600;
        }

        pre {
            margin:
                12px
                0
                0;

            padding: 12px;

            overflow: auto;

            max-height: 650px;

            white-space: pre-wrap;
            word-break: break-word;

            border-radius: 9px;

            background:
                color-mix(
                    in srgb,
                    Canvas 90%,
                    CanvasText 10%
                );

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;

            font-size: 12px;

            line-height: 1.45;
        }

        .extensions {
            columns:
                2
                300px;

            column-gap: 28px;

            margin-top: 12px;
        }

        .extension {
            break-inside: avoid;

            padding:
                3px
                0;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;

            font-size: 12px;
        }

        .muted {
            opacity: 0.65;
        }

        .ok {
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 13px;
            }
        }
    </style>
</head>

<body>
<div class="page">
    <h1>Phone Check</h1>

    <p class="subtitle">
        WebGL1 / WebGL2 diagnostics for real-device ↔ Zenno comparison.
    </p>

    <section class="card">
        <h2>Environment</h2>

        <div
            id="environment-grid"
            class="grid"
        ></div>
    </section>


    <section class="card">
        <h2>WebGL summary</h2>

        <div
            id="webgl-summary"
            class="grid"
        >
            Сбор данных...
        </div>

        <div class="buttons">
            <button
                id="copy-json"
                type="button"
            >
                Скопировать WebGL JSON
            </button>

            <button
                id="refresh"
                type="button"
            >
                Переснять
            </button>
        </div>

        <div
            id="copy-status"
            class="status"
        ></div>
    </section>


    <section class="card">
        <h2>WebGL1 extensions</h2>

        <div
            id="webgl1-meta"
            class="muted"
        ></div>

        <div
            id="webgl1-extensions"
            class="extensions"
        ></div>
    </section>


    <section class="card">
        <h2>WebGL2 extensions</h2>

        <div
            id="webgl2-meta"
            class="muted"
        ></div>

        <div
            id="webgl2-extensions"
            class="extensions"
        ></div>
    </section>


    <section class="card">
        <h2>Полный JSON</h2>

        <details>
            <summary>
                Показать / скрыть
            </summary>

            <pre id="json-output"></pre>
        </details>
    </section>
</div>


<script>
(function () {
    'use strict';


    // =========================================================
    // HELPERS
    // =========================================================

    function safe(fn, fallback) {
        try {
            return fn();
        }
        catch (e) {
            return fallback;
        }
    }


    function normalizeValue(value) {
        try {
            if (
                value !== null &&
                typeof value === 'object' &&
                typeof value.length === 'number'
            ) {
                return Array.from(value);
            }
        }
        catch (e) {
        }

        return value;
    }


    function safeGetParameter(gl, parameter) {
        try {
            return normalizeValue(
                gl.getParameter(parameter)
            );
        }
        catch (e) {
            return null;
        }
    }


    function metric(label, value) {
        const item =
            document.createElement('div');

        item.className =
            'metric';

        const labelNode =
            document.createElement('span');

        labelNode.className =
            'metric-label';

        labelNode.textContent =
            label;

        const valueNode =
            document.createElement('span');

        valueNode.className =
            'metric-value';

        if (
            Array.isArray(value)
        ) {
            valueNode.textContent =
                value.join(' × ');
        }
        else {
            valueNode.textContent =
                value === null ||
                typeof value === 'undefined'
                    ? 'null'
                    : String(value);
        }

        item.appendChild(
            labelNode
        );

        item.appendChild(
            valueNode
        );

        return item;
    }


    function renderMetricGrid(
        element,
        items
    ) {
        element.innerHTML = '';

        for (
            const item
            of items
        ) {
            element.appendChild(
                metric(
                    item[0],
                    item[1]
                )
            );
        }
    }


    function renderExtensions(
        element,
        extensions
    ) {
        element.innerHTML = '';

        if (
            !extensions ||
            extensions.length === 0
        ) {
            const empty =
                document.createElement('div');

            empty.className =
                'muted';

            empty.textContent =
                '<NONE>';

            element.appendChild(
                empty
            );

            return;
        }

        for (
            const extension
            of extensions
        ) {
            const row =
                document.createElement('div');

            row.className =
                'extension';

            row.textContent =
                extension;

            element.appendChild(
                row
            );
        }
    }


    // =========================================================
    // WEBGL
    // =========================================================

    function collectWebGL(
        contextName
    ) {
        const canvas =
            document.createElement(
                'canvas'
            );

        let gl = null;

        try {
            gl =
                canvas.getContext(
                    contextName
                );
        }
        catch (e) {
            return {
                context:
                    contextName,

                available:
                    false,

                error:
                    String(
                        e &&
                        e.message
                            ? e.message
                            : e
                    )
            };
        }

        if (!gl) {
            return {
                context:
                    contextName,

                available:
                    false,

                error:
                    null
            };
        }


        // -----------------------------------------------------
        // EXTENSIONS
        // -----------------------------------------------------

        let extensions = [];

        try {
            extensions =
                Array.from(
                    gl.getSupportedExtensions() ||
                    []
                );

            extensions.sort();
        }
        catch (e) {
            extensions = [];
        }


        // -----------------------------------------------------
        // DEBUG RENDERER
        // -----------------------------------------------------

        let unmaskedVendor = null;
        let unmaskedRenderer = null;

        try {
            const debugInfo =
                gl.getExtension(
                    'WEBGL_debug_renderer_info'
                );

            if (debugInfo) {
                unmaskedVendor =
                    safeGetParameter(
                        gl,
                        debugInfo.UNMASKED_VENDOR_WEBGL
                    );

                unmaskedRenderer =
                    safeGetParameter(
                        gl,
                        debugInfo.UNMASKED_RENDERER_WEBGL
                    );
            }
        }
        catch (e) {
        }


        // -----------------------------------------------------
        // COMMON LIMITS
        // -----------------------------------------------------

        const limits = {
            MAX_TEXTURE_SIZE:
                safeGetParameter(
                    gl,
                    gl.MAX_TEXTURE_SIZE
                ),

            MAX_CUBE_MAP_TEXTURE_SIZE:
                safeGetParameter(
                    gl,
                    gl.MAX_CUBE_MAP_TEXTURE_SIZE
                ),

            MAX_RENDERBUFFER_SIZE:
                safeGetParameter(
                    gl,
                    gl.MAX_RENDERBUFFER_SIZE
                ),

            MAX_VIEWPORT_DIMS:
                safeGetParameter(
                    gl,
                    gl.MAX_VIEWPORT_DIMS
                ),

            MAX_VERTEX_ATTRIBS:
                safeGetParameter(
                    gl,
                    gl.MAX_VERTEX_ATTRIBS
                ),

            MAX_TEXTURE_IMAGE_UNITS:
                safeGetParameter(
                    gl,
                    gl.MAX_TEXTURE_IMAGE_UNITS
                ),

            MAX_VERTEX_TEXTURE_IMAGE_UNITS:
                safeGetParameter(
                    gl,
                    gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS
                ),

            MAX_COMBINED_TEXTURE_IMAGE_UNITS:
                safeGetParameter(
                    gl,
                    gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS
                ),

            MAX_VERTEX_UNIFORM_VECTORS:
                safeGetParameter(
                    gl,
                    gl.MAX_VERTEX_UNIFORM_VECTORS
                ),

            MAX_FRAGMENT_UNIFORM_VECTORS:
                safeGetParameter(
                    gl,
                    gl.MAX_FRAGMENT_UNIFORM_VECTORS
                ),

            MAX_VARYING_VECTORS:
                safeGetParameter(
                    gl,
                    gl.MAX_VARYING_VECTORS
                )
        };


        // -----------------------------------------------------
        // WEBGL2-SPECIFIC LIMITS
        // -----------------------------------------------------

        if (
            contextName ===
            'webgl2'
        ) {
            limits.MAX_3D_TEXTURE_SIZE =
                safeGetParameter(
                    gl,
                    gl.MAX_3D_TEXTURE_SIZE
                );

            limits.MAX_ARRAY_TEXTURE_LAYERS =
                safeGetParameter(
                    gl,
                    gl.MAX_ARRAY_TEXTURE_LAYERS
                );

            limits.MAX_UNIFORM_BUFFER_BINDINGS =
                safeGetParameter(
                    gl,
                    gl.MAX_UNIFORM_BUFFER_BINDINGS
                );

            limits.MAX_UNIFORM_BLOCK_SIZE =
                safeGetParameter(
                    gl,
                    gl.MAX_UNIFORM_BLOCK_SIZE
                );

            limits.MAX_SAMPLES =
                safeGetParameter(
                    gl,
                    gl.MAX_SAMPLES
                );
        }


        return {
            context:
                contextName,

            available:
                true,

            vendor:
                safeGetParameter(
                    gl,
                    gl.VENDOR
                ),

            renderer:
                safeGetParameter(
                    gl,
                    gl.RENDERER
                ),

            unmaskedVendor:
                unmaskedVendor,

            unmaskedRenderer:
                unmaskedRenderer,

            version:
                safeGetParameter(
                    gl,
                    gl.VERSION
                ),

            shadingLanguageVersion:
                safeGetParameter(
                    gl,
                    gl.SHADING_LANGUAGE_VERSION
                ),

            limits:
                limits,

            extensionsCount:
                extensions.length,

            extensions:
                extensions
        };
    }


    // =========================================================
    // ENVIRONMENT
    // =========================================================

    function collectEnvironment() {
        const connection =
            navigator.connection ||
            navigator.mozConnection ||
            navigator.webkitConnection ||
            null;

        return {
            userAgent:
                safe(
                    () => navigator.userAgent,
                    null
                ),

            platform:
                safe(
                    () => navigator.platform,
                    null
                ),

            language:
                safe(
                    () => navigator.language,
                    null
                ),

            hardwareConcurrency:
                safe(
                    () => navigator.hardwareConcurrency,
                    null
                ),

            deviceMemory:
                safe(
                    () => navigator.deviceMemory,
                    null
                ),

            maxTouchPoints:
                safe(
                    () => navigator.maxTouchPoints,
                    null
                ),

            devicePixelRatio:
                safe(
                    () => window.devicePixelRatio,
                    null
                ),

            screen:
                {
                    width:
                        safe(
                            () => screen.width,
                            null
                        ),

                    height:
                        safe(
                            () => screen.height,
                            null
                        ),

                    availWidth:
                        safe(
                            () => screen.availWidth,
                            null
                        ),

                    availHeight:
                        safe(
                            () => screen.availHeight,
                            null
                        )
                },

            viewport:
                {
                    innerWidth:
                        safe(
                            () => window.innerWidth,
                            null
                        ),

                    innerHeight:
                        safe(
                            () => window.innerHeight,
                            null
                        ),

                    outerWidth:
                        safe(
                            () => window.outerWidth,
                            null
                        ),

                    outerHeight:
                        safe(
                            () => window.outerHeight,
                            null
                        )
                },

            connection:
                connection
                    ? {
                        type:
                            safe(
                                () => connection.type,
                                null
                            ),

                        effectiveType:
                            safe(
                                () => connection.effectiveType,
                                null
                            ),

                        rtt:
                            safe(
                                () => connection.rtt,
                                null
                            ),

                        rttType:
                            safe(
                                () => typeof connection.rtt,
                                null
                            ),

                        downlink:
                            safe(
                                () => connection.downlink,
                                null
                            ),

                        downlinkMax:
                            safe(
                                () => connection.downlinkMax,
                                null
                            ),

                        downlinkMaxType:
                            safe(
                                () => typeof connection.downlinkMax,
                                null
                            ),

                        saveData:
                            safe(
                                () => connection.saveData,
                                null
                            ),

                        saveDataType:
                            safe(
                                () => typeof connection.saveData,
                                null
                            )
                    }
                    : null
        };
    }


    // =========================================================
    // COLLECT + RENDER
    // =========================================================

    let currentResult = null;


    function collectAll() {
        const environment =
            collectEnvironment();

        const webgl1 =
            collectWebGL(
                'webgl'
            );

        const webgl2 =
            collectWebGL(
                'webgl2'
            );

        currentResult = {
            timestamp:
                new Date().toISOString(),

            environment:
                environment,

            webgl1:
                webgl1,

            webgl2:
                webgl2
        };

        window.__phoneCheckDiagnostics =
            currentResult;

        renderAll();
    }


    function renderAll() {
        const env =
            currentResult.environment;

        renderMetricGrid(
            document.getElementById(
                'environment-grid'
            ),
            [
                [
                    'User-Agent',
                    env.userAgent
                ],
                [
                    'Platform',
                    env.platform
                ],
                [
                    'Language',
                    env.language
                ],
                [
                    'hardwareConcurrency',
                    env.hardwareConcurrency
                ],
                [
                    'deviceMemory',
                    env.deviceMemory
                ],
                [
                    'maxTouchPoints',
                    env.maxTouchPoints
                ],
                [
                    'devicePixelRatio',
                    env.devicePixelRatio
                ],
                [
                    'screen',
                    [
                        env.screen.width,
                        env.screen.height
                    ]
                ],
                [
                    'screen.avail',
                    [
                        env.screen.availWidth,
                        env.screen.availHeight
                    ]
                ],
                [
                    'inner',
                    [
                        env.viewport.innerWidth,
                        env.viewport.innerHeight
                    ]
                ],
                [
                    'outer',
                    [
                        env.viewport.outerWidth,
                        env.viewport.outerHeight
                    ]
                ],
                [
                    'connection.type',
                    env.connection
                        ? env.connection.type
                        : null
                ],
                [
                    'connection.effectiveType',
                    env.connection
                        ? env.connection.effectiveType
                        : null
                ],
                [
                    'connection.rtt',
                    env.connection
                        ? (
                            String(
                                env.connection.rtt
                            ) +
                            ' (' +
                            env.connection.rttType +
                            ')'
                        )
                        : null
                ],
                [
                    'connection.downlink',
                    env.connection
                        ? env.connection.downlink
                        : null
                ],
                [
                    'connection.downlinkMax',
                    env.connection
                        ? (
                            String(
                                env.connection.downlinkMax
                            ) +
                            ' (' +
                            env.connection.downlinkMaxType +
                            ')'
                        )
                        : null
                ],
                [
                    'connection.saveData',
                    env.connection
                        ? (
                            String(
                                env.connection.saveData
                            ) +
                            ' (' +
                            env.connection.saveDataType +
                            ')'
                        )
                        : null
                ]
            ]
        );


        // -----------------------------------------------------
        // WebGL summary
        // -----------------------------------------------------

        const w1 =
            currentResult.webgl1;

        const w2 =
            currentResult.webgl2;

        renderMetricGrid(
            document.getElementById(
                'webgl-summary'
            ),
            [
                [
                    'WebGL1 available',
                    w1.available
                ],
                [
                    'WebGL1 extensions',
                    w1.available
                        ? w1.extensionsCount
                        : null
                ],
                [
                    'WebGL1 renderer',
                    w1.available
                        ? (
                            w1.unmaskedRenderer ||
                            w1.renderer
                        )
                        : null
                ],
                [
                    'WebGL2 available',
                    w2.available
                ],
                [
                    'WebGL2 extensions',
                    w2.available
                        ? w2.extensionsCount
                        : null
                ],
                [
                    'WebGL2 renderer',
                    w2.available
                        ? (
                            w2.unmaskedRenderer ||
                            w2.renderer
                        )
                        : null
                ]
            ]
        );


        // -----------------------------------------------------
        // WebGL1 extensions
        // -----------------------------------------------------

        document.getElementById(
            'webgl1-meta'
        ).textContent =
            w1.available
                ? (
                    'count=' +
                    w1.extensionsCount +
                    ' | ' +
                    String(
                        w1.unmaskedRenderer ||
                        w1.renderer ||
                        ''
                    )
                )
                : 'WebGL1 недоступен';

        renderExtensions(
            document.getElementById(
                'webgl1-extensions'
            ),
            w1.extensions || []
        );


        // -----------------------------------------------------
        // WebGL2 extensions
        // -----------------------------------------------------

        document.getElementById(
            'webgl2-meta'
        ).textContent =
            w2.available
                ? (
                    'count=' +
                    w2.extensionsCount +
                    ' | ' +
                    String(
                        w2.unmaskedRenderer ||
                        w2.renderer ||
                        ''
                    )
                )
                : 'WebGL2 недоступен';

        renderExtensions(
            document.getElementById(
                'webgl2-extensions'
            ),
            w2.extensions || []
        );


        // -----------------------------------------------------
        // JSON
        // -----------------------------------------------------

        document.getElementById(
            'json-output'
        ).textContent =
            JSON.stringify(
                currentResult,
                null,
                2
            );
    }


    // =========================================================
    // COPY
    // =========================================================

    async function copyJson() {
        const status =
            document.getElementById(
                'copy-status'
            );

        const text =
            JSON.stringify(
                currentResult,
                null,
                2
            );

        try {
            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {
                await navigator.clipboard.writeText(
                    text
                );

                status.textContent =
                    '✓ JSON скопирован';

                status.className =
                    'status ok';

                return;
            }
        }
        catch (e) {
        }


        try {
            const textarea =
                document.createElement(
                    'textarea'
                );

            textarea.value =
                text;

            textarea.setAttribute(
                'readonly',
                ''
            );

            textarea.style.position =
                'fixed';

            textarea.style.left =
                '-9999px';

            textarea.style.top =
                '0';

            document.body.appendChild(
                textarea
            );

            textarea.focus();
            textarea.select();

            const copied =
                document.execCommand(
                    'copy'
                );

            textarea.remove();

            if (!copied) {
                throw new Error(
                    'execCommand(copy) returned false'
                );
            }

            status.textContent =
                '✓ JSON скопирован';

            status.className =
                'status ok';
        }
        catch (e) {
            status.textContent =
                '✗ Автоматическое копирование не сработало. ' +
                'Открой блок «Полный JSON» и скопируй его вручную.';

            status.className =
                'status';
        }
    }


    // =========================================================
    // EVENTS
    // =========================================================

    document.getElementById(
        'copy-json'
    ).addEventListener(
        'click',
        copyJson
    );


    document.getElementById(
        'refresh'
    ).addEventListener(
        'click',
        function () {
            document.getElementById(
                'copy-status'
            ).textContent =
                '';

            collectAll();
        }
    );


    // =========================================================
    // START
    // =========================================================

    collectAll();

})();
</script>

</body>
</html>
